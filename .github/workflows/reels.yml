name: Bollywood Reels

# Every six hours, plus manual runs. The generator appends to its own ledger,
# so no git writes (and no write token) are required. CI uses only the built-in
# GITHUB_TOKEN with contents:read — no GitHub PAT and no Netlify PAT/login, and
# no Netlify deploy step. All publishing goes through the official Buffer API.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: bollywood-reels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg / ffprobe
        # ubuntu-latest does not ship ffprobe; the generator needs it for
        # audio durations, BGM looping and the final MP4 size cap.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install pinned CLIs together
        # A second `npm install --no-save` prunes the first package, so install
        # both in one command or the HyperFrames binary disappears.
        run: npm install --no-save hyperframes@0.9.77 netlify-cli@24 --silent

      - name: Point generator at pinned CLI
        run: |
          echo "HYPERFRAMES_CLI=${GITHUB_WORKSPACE}/node_modules/hyperframes/bin/hyperframes.mjs" >> "$GITHUB_ENV"

      - name: Verify CLI path
        run: test -f "$HYPERFRAMES_CLI"

      - name: Generate reel
        run: python generate.py --run --count 1
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          BLOB_STATE_TOKEN: ${{ secrets.BLOB_STATE_TOKEN }}
          BLOB_STATE_STORE_ID: ${{ secrets.BLOB_STATE_STORE_ID }}
          BLOB_VIDEO_TOKEN: ${{ secrets.BLOB_VIDEO_TOKEN }}
          BLOB_VIDEO_STORE_ID: ${{ secrets.BLOB_VIDEO_STORE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_LONG_LIVED_TOKEN: ${{ secrets.IG_LONG_LIVED_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # Buffer is the primary publishing provider: official API, long-lived
          # personal key, no monthly login and no Meta/Google app verification.
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_YT_CHANNEL_ID: ${{ secrets.BUFFER_YT_CHANNEL_ID }}
          BUFFER_IG_CHANNEL_ID: ${{ secrets.BUFFER_IG_CHANNEL_ID }}

      - name: Keep Netlify site warm
        # Netlify's free plan can pause projects with no traffic. A plain HTTPS
        # GET keeps the site active; this is not a deploy and uses no build
        # credits. || true means a temporary outage never fails the job.
        run: |
          curl --fail --silent --show-error --max-time 20 https://bollywood-reel-generator.netlify.app > /dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_id }}
          # Two days at ~6 runs/day keeps artifact storage under GitHub's
          # 500 MB free budget. Work dirs are deleted after rendering.
          retention-days: 2
          path: |
            out/*.mp4
            out/*.manifest.json
            out/*.debug.json
          if-no-files-found: warn

      - name: Notify on failure
        if: failure()
        run: python notify_failure.py
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
