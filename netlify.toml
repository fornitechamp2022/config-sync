# Netlify configuration for public MP4 hosting.
#
# Deliberately NO [build] section: the static site (subscribe page and
# OneSignalSDKWorker.js) is deployed to this Netlify site by a separate
# process. Declaring a build command or publish directory here would replace
# those files. This file only registers the edge function and adds an alias.

# The path pattern itself provides the clean public URL, so the function sees
# the original pathname and can read the blob key directly from it. No rewrite
# is needed for /r/<key>, which also avoids invoking the function twice.
[[edge_functions]]
  path = "/r/*"
  function = "video"

# Friendly alias for the same bytes. The function also accepts the query form
# /.netlify/edge-functions/video?key=<key> when called directly.
[[redirects]]
  from = "/video/*"
  to = "/r/:splat"
  status = 301
  force = true
