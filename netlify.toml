# Netlify config for public MP4 hosting.
[build]
  command = ""
  publish = "public"
  functions = "netlify/functions"
  # Keep the experimental Edge Function sources out of bundling; the proven
  # serverless function below serves the same public URL.
  edge_functions = "netlify/edge-functions-disabled"

# Clean public URL: /r/<blob key> -> serverless function, which streams the
# MP4 from the reels-media Blob store with Range support.
[[redirects]]
  from = "/r/*"
  to = "/.netlify/functions/video?key=:splat"
  status = 200
  force = true
